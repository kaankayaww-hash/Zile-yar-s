<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zile Sitte Multiplayer Drift</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #ff3b30; }
        .garaj { background: #1e1e1e; padding: 20px; border-radius: 10px; display: inline-block; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        select, input, button { padding: 10px; margin: 10px; font-size: 16px; border-radius: 5px; border: none; }
        input { background: #2c2c2c; color: white; }
        button { background-color: #ff3b30; color: white; cursor: pointer; }
        button:hover { background-color: #e0322b; }
        #oyunAlani { margin-top: 20px; width: 100%; height: 350px; background: #2c2c2c; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        #lobii { color: #00ffcc; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🌐 Zile Sitte Multiplayer Sokak Yarışı 🌐</h1>
    <p>Aynı anda sunucuya bağlan, arkadaşlarınla Sitte'nin tozunu attır!</p>

    <div class="garaj">
        <h2>🛠️ Multiplayer Sitte Garajı</h2>
        <input type="text" id="oyuncuAdi" placeholder="Oyuncu Adın (Pistachio vb.)">
        <br>
        <select id="aracSecim">
            <option value="tofas">Tofaş Şahin (Sitte Special)</option>
            <option value="doblo">Fiat Doblo (Esnaf Kurye)</option>
            <option value="egea">Fiat Egea (Şehir İçi)</option>
            <option value="f1">Formula 1 Aracı (Çılgın Mod)</option>
            <option value="lambo">Süper Spor (Lambo Tarzı)</option>
            <option value="ferrari">Süper Spor (Ferrari Tarzı)</option>
        </select>
        <br>
        <button onclick="multiplayerBaglan()">Sunucuya Bağlan ve Gazla! 🏎️💨</button>
    </div>

    <div id="oyunAlani">
        <p id="durumMetni">Henüz bağlantı kurulmadı. Garajdan aracını seç ve piste çık!</p>
        <div id="lobii"></div>
    </div>

    <script>
        function multiplayerBaglan() {
            const isim = document.getElementById('oyuncuAdi').value || "Gizli Sürücü";
            const secilenArac = document.getElementById('aracSecim').value;
            const durum = document.getElementById('durumMetni');
            const lobi = document.getElementById('lobii');
            
            let aracIsmi = "";
            switch(secilenArac) {
                case 'tofas': aracIsmi = "Tofaş Şahin"; break;
                case 'doblo': aracIsmi = "Fiat Doblo"; break;
                case 'egea': aracIsmi = "Fiat Egea"; break;
                case 'f1': aracIsmi = "Formula 1 Aracı"; break;
                case 'lambo': aracIsmi = "Süper Spor (Lambo)"; break;
                case 'ferrari': aracIsmi = "Süper Spor (Ferrari)"; break;
            }

            durum.innerHTML = `🔥 <b>${isim}</b>, ${aracIsmi} ile Zile Sitte sunucusuna giriş yaptı!`;
            lobi.innerHTML = `🟢 Durum: Çevrimiçi (Multiplayer Oda Aktif) - Diğer oyuncuların bağlanması bekleniyor...`;
        }
    </script>

</body>
</html>
