<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Zile Sokakları 3D - GLTF Harita Entegre</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        #dashboard { background: rgba(0, 0, 0, 0.6); padding: 15px 25px; border-radius: 15px; margin: 15px; color: #fff; font-size: 18px; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1); width: fit-content; }
        .speed-val { font-size: 32px; font-weight: bold; color: #ff3b30; }
        .gear-val { font-size: 20px; color: #34c759; font-weight: bold; }

        #controls { pointer-events: auto; display: flex; justify-content: space-between; align-items: flex-end; padding: 20px; }
        .steering-group { display: flex; gap: 15px; }
        .pedal-group { display: flex; gap: 15px; align-items: flex-end; }
        
        .btn { width: 70px; height: 70px; background: rgba(255, 255, 255, 0.2); border: 2px solid #fff; border-radius: 50%; color: white; font-size: 24px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; backdrop-filter: blur(5px); }
        .btn:active { background: rgba(255, 59, 48, 0.8); transform: scale(0.95); }
        .btn-pedal { width: 75px; height: 110px; border-radius: 15px; }
        .btn-gas { background: rgba(52, 199, 89, 0.4); border-color: #34c759; }
        .btn-brake { background: rgba(255, 59, 48, 0.4); border-color: #ff3b30; }
        
        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #111, #222); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 10; }
        h1 { margin-bottom: 5px; color: #ff3b30; text-shadow: 0 0 10px rgba(255,59,48,0.5); font-size: 36px; }
        select, button { padding: 12px 25px; font-size: 18px; border-radius: 8px; border: none; margin: 10px; cursor: pointer; }
        select { background: #333; color: white; border: 1px solid #555; }
        .btn-start { background: #ff3b30; color: white; font-weight: bold; font-size: 22px; transition: 0.2s; }
        .btn-start:hover { background: #e0322b; transform: scale(1.05); }
    </style>
    <!-- Three.js ve GLTF Yükleyici Kütüphaneleri -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="menu">
        <h1>ZİLE SOKAKLARI 3D</h1>
        <p>3D Harita Destekli Otomatik Vites Sokak Yarışı 🚦</p>
        
        <div>
            <label for="carSelect">Araba Seç:</label>
            <select id="carSelect">
                <option value="tofas_sahin">Tofaş Şahin</option>
                <option value="tofas_dogan">Tofaş Doğan</option>
                <option value="fiat_egea">Fiat Egea</option>
                <option value="fiat_toplu">Fiat Toplu</option>
                <option value="lamborghini">Lamborghini</option>
                <option value="audi_a6">Audi A6</option>
                <option value="audi_a5">Audi A5</option>
            </select>
        </div>

        <div>
            <label for="graphicsSelect">Grafik Ayarı:</label>
            <select id="graphicsSelect">
                <option value="low">Düşük</option>
                <option value="medium" selected>Orta</option>
                <option value="high">Yüksek</option>
            </select>
        </div>

        <button class="btn-start" onclick="initGame()">YARIŞA BAŞLA 🏎️</button>
    </div>

    <div id="ui">
        <div id="dashboard">
            <div>Hız: <span class="speed-val" id="speed">0</span> km/h</div>
            <div>Vites: <span class="gear-val" id="gear">D (Otomatik)</span></div>
            <div>Konum: 📍 Zile Haritası</div>
        </div>

        <div id="controls">
            <div class="steering-group">
                <div class="btn" id="btnLeft">◀</div>
                <div class="btn" id="btnRight">▶</div>
            </div>
            <div class="pedal-group">
                <div class="btn btn-pedal btn-brake" id="btnBrake">FREN / R</div>
                <div class="btn btn-pedal btn-gas" id="btnGas">GAZ</div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, car;
        let speed = 0;
        let maxSpeed = 180;
        let keys = { gas: false, brake: false, left: false, right: false };

        function initGame() {
            document.getElementById('menu').style.display = 'none';

            const carType = document.getElementById('carSelect').value;
            const graphics = document.getElementById('graphicsSelect').value;

            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 20, 200);

            // Camera Setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            // Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: graphics !== 'low' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (graphics === 'high') renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.9);
            sunLight.position.set(50, 100, 50);
            if (graphics === 'high') sunLight.castShadow = true;
            scene.add(sunLight);

            // 3D Zile Harita Dosyasını Yükleme (GLTF Loader)
            loadZileMap();

            // Seçilen Arabayı Oluşturma
            createCar(carType);

            // Kontroller
            setupControls();

            // Oyun Döngüsü
            animate();
        }

        function loadZileMap() {
            const loader = new THREE.GLTFLoader();
            // GitHub deposuna yükleyeceğin harita dosyasının adı: zile_haritasi.glb
            loader.load('zile_haritasi.glb', function (gltf) {
                const mapModel = gltf.scene;
                mapModel.position.set(0, 0, 0);
                scene.add(mapModel);
                console.log("Zile 3D haritası yüklendi! 🗺️");
            }, undefined, function (error) {
                console.warn("Zile harita dosyası henüz depoya yüklenmedi. Yedek yol oluşturuluyor... ⚠️");
                createFallbackRoad();
            });
        }

        function createFallbackRoad() {
            const roadGeo = new THREE.PlaneGeometry(20, 2000);
            const roadMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            scene.add(road);
        }

        function createCar(type) {
            car = new THREE.Group();
            let carColor = 0xff3b30;

            if (type.includes('sahin') || type.includes('dogan')) carColor = 0xffffff;
            if (type.includes('lamborghini')) carColor = 0xffcc00;
            if (type.includes('audi')) carColor = 0x222222;
            if (type.includes('egea')) carColor = 0x888888;

            const bodyGeo = new THREE.BoxGeometry(2.2, 1.2, 4.5);
            const bodyMat = new THREE.MeshPhongMaterial({ color: carColor });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.8;
            car.add(body);

            const cabinGeo = new THREE.BoxGeometry(1.8, 0.9, 2.2);
            const cabinMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 1.7, -0.2);
            car.add(cabin);

            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 16);
            const wheelMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
            const wheelPositions = [[-1.2, 0.4, 1.4], [1.2, 0.4, 1.4], [-1.2, 0.4, -1.4], [1.2, 0.4, -1.4]];

            wheelPositions.forEach(pos => {
                const w = new THREE.Mesh(wheelGeo, wheelMat);
                w.rotation.z = Math.PI / 2;
                w.position.set(...pos);
                car.add(w);
            });

            scene.add(car);
        }

        function setupControls() {
            const bindTouch = (id, key) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
                el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
                el.addEventListener('mousedown', () => keys[key] = true);
                el.addEventListener('mouseup', () => keys[key] = false);
            };

            bindTouch('btnGas', 'gas');
            bindTouch('btnBrake', 'brake');
            bindTouch('btnLeft', 'left');
            bindTouch('btnRight', 'right');

            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp' || e.key === 'w') keys.gas = true;
                if (e.key === 'ArrowDown' || e.key === 's') keys.brake = true;
                if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
                if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowUp' || e.key === 'w') keys.gas = false;
                if (e.key === 'ArrowDown' || e.key === 's') keys.brake = false;
                if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
                if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            if (keys.gas) {
                if (speed < maxSpeed) speed += 0.8;
            } else if (keys.brake) {
                if (speed > -40) speed -= 1.2;
            } else {
                speed *= 0.98;
            }

            if (keys.left && Math.abs(speed) > 1) car.position.x -= 0.15 * (speed / 50);
            if (keys.right && Math.abs(speed) > 1) car.position.x += 0.15 * (speed / 50);

            car.position.z -= speed * 0.03;

            camera.position.set(car.position.x, car.position.y + 4, car.position.z + 10);
            camera.lookAt(car.position.x, car.position.y + 1, car.position.z - 5);

            document.getElementById('speed').innerText = Math.round(Math.abs(speed));
            
            let gearText = "N";
            if (speed > 5) gearText = "D (Otomatik)";
            else if (speed < -2) gearText = "R (Geri)";
            document.getElementById('gear').innerText = gearText;

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
