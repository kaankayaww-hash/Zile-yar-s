<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zile Sokakları - 3D Multiplayer</title>
    <style>
        body { margin: 0; background: #121212; color: #ff3b30; font-family: Arial, sans-serif; overflow: hidden; }
        #menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(0,0,0,0.8); padding: 30px; border-radius: 10px; }
        button, select { padding: 12px 20px; margin: 10px; background: #ff3b30; color: white; border: none; font-size: 16px; cursor: pointer; border-radius: 5px; }
        button:hover { background: #e0322b; }
        #ui { position: absolute; top: 10px; left: 10px; display: none; }
    </style>
</head>
<body>
    <div id="menu">
        <h1>Zile Sokakları 3D</h1>
        <p>Multiplayer & Singleplayer Sokak Yarışı</p>
        <div>
            <label>Grafik Ayarı:</label>
            <select id="graphics">
                <option value="low">Düşük</option>
                <option value="medium" selected>Orta</option>
                <option value="high">Yüksek</option>
            </select>
        </div>
        <div>
            <button onclick="startGame('single')">Single Player Başla</button>
            <button onclick="startGame('multi')">Multiplayer Bağlan</button>
        </div>
    </div>

    <div id="ui">
        <h2>Zile Haritasındasınız</h2>
        <p>Işıklar ve trafik aktif!</p>
    </div>

    <script>
        function startGame(mode) {
            const graphics = document.getElementById('graphics').value;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            console.log(mode + " modunda, " + graphics + " grafik ayarıyla Zile yükleniyor...");
            // 3D motoru ve Zile haritası buraya entegre edilecek
        }
    </script>
</body>
</html>
